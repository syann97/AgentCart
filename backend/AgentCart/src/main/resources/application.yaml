spring:
  application:
    name: AgentCart
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000    # 30 minutes (ms)
  refresh-token-expiration: 604800000 # 7 days (ms)

cookie:
  secure: true
  same-site: None



